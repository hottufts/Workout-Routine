<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Full-Body Routine</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#C2185B">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #FDF6F7;
    color: #2E2A25;
    max-width: 480px;
    margin: 0 auto;
    padding-bottom: 40px;
  }
  header { text-align: center; padding: 28px 20px 16px; }
  .header-row { display: flex; align-items: center; justify-content: center; gap: 8px; }
  h1 { font-size: 26px; font-weight: 700; color: #C2185B; }
  .subtitle { font-size: 13px; color: #9C4F63; font-style: italic; margin-top: 4px; }
  nav { display: flex; gap: 8px; padding: 0 20px; margin-bottom: 8px; }
  .tab-btn {
    flex: 1; padding: 10px 0; background: transparent; border: none;
    border-bottom: 2px solid #F3DCE3; font-weight: 700; font-size: 14px;
    color: #C48A9B; cursor: pointer;
  }
  .tab-btn.active { border-bottom: 2px solid #C2185B; color: #C2185B; }
  .content { padding: 8px 20px 20px; }
  .section-title { font-size: 19px; font-weight: 700; color: #C2185B; margin: 8px 0 14px; }
  .simple-list, .list {
    background: #fff; border-radius: 16px; overflow: hidden;
    border: 1px solid #F3DCE3; margin-bottom: 20px;
  }
  .simple-item { padding: 13px 16px; font-size: 14px; border-bottom: 1px solid #FBEEF1; }
  .simple-item:last-child { border-bottom: none; }
  .check-item {
    padding: 13px 16px; font-size: 14px; border-bottom: 1px solid #FBEEF1;
    display: flex; align-items: center; gap: 10px; cursor: pointer;
  }
  .check-item:last-child { border-bottom: none; }
  .check-circle {
    width: 20px; height: 20px; border-radius: 50%; border: 2px solid #E8A0B4;
    flex-shrink: 0; display: flex; align-items: center; justify-content: center;
    font-size: 12px; color: #fff;
  }
  .check-item.checked .check-circle { background: #8FA68E; border-color: #8FA68E; }
  .check-item.checked .check-label { text-decoration: line-through; color: #A9788A; }
  .progress-text { font-size: 12px; color: #9C4F63; font-weight: 700; }
  .progress-track { height: 6px; background: #F3DCE3; border-radius: 4px; margin-top: 6px; overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, #E8A0B4, #C2185B); border-radius: 4px; transition: width .3s; }
  .row {
    display: flex; align-items: center; padding: 14px 16px;
    border-bottom: 1px solid #FBEEF1; cursor: pointer;
  }
  .row:last-child { border-bottom: none; }
  .row-main { flex: 1; }
  .ex-name { font-size: 15px; font-weight: 700; }
  .ex-meta { font-size: 12.5px; color: #A9788A; margin-top: 2px; }
  .row-actions { display: flex; align-items: center; gap: 10px; }
  .skip-btn {
    background: #FBEEF1; border: none; border-radius: 8px; padding: 6px 10px;
    font-size: 12px; font-weight: 700; color: #C48A9B; cursor: pointer;
  }
  .badge {
    border-radius: 50%; width: 24px; height: 24px; display: flex;
    align-items: center; justify-content: center; font-size: 13px; color: #fff;
  }
  .badge.done { background: #8FA68E; }
  .badge.skipped { background: #E8DCC8; color: #8C7A55; }
  .chevron { color: #C48A9B; font-size: 18px; }
  .primary-btn {
    width: 100%; background: #C2185B; color: #fff; border: none; border-radius: 14px;
    padding: 15px 0; font-size: 15px; font-weight: 800; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  .primary-btn:disabled { opacity: .6; cursor: default; }
  .stat-box {
    background: #fff; border: 1px solid #F3DCE3; border-radius: 14px;
    padding: 12px 16px; margin-bottom: 12px;
  }
  .stat-label { font-size: 12.5px; color: #9C4F63; font-weight: 700; margin-bottom: 6px; }
  .stat-input {
    width: 100%; border: none; outline: none; font-size: 18px; font-weight: 700;
    background: transparent; font-family: inherit;
  }
  .done-wrap { text-align: center; padding: 40px 20px; }
  .done-emoji { font-size: 40px; margin-bottom: 8px; }
  .done-title { font-size: 22px; color: #C2185B; margin-bottom: 6px; }
  .done-stats { display: flex; justify-content: center; gap: 14px; margin-top: 16px; font-size: 13px; font-weight: 700; }
  .view-progress-btn {
    margin-top: 24px; background: #FBEEF1; color: #C2185B; border: none; border-radius: 12px;
    padding: 10px 18px; font-size: 13px; font-weight: 800; cursor: pointer;
  }
  .empty-state { text-align: center; padding: 60px 20px; }
  .empty-state p { font-size: 14px; color: #A9788A; margin-top: 12px; line-height: 1.6; }
  .chart-card { background: #fff; border: 1px solid #F3DCE3; border-radius: 16px; padding: 14px 16px; margin-bottom: 12px; }
  .chart-header { display: flex; justify-content: space-between; margin-bottom: 8px; }
  .chart-header .name { font-size: 14px; font-weight: 800; }
  .chart-header .latest { font-size: 13px; font-weight: 700; color: #C2185B; }
  .bars { display: flex; align-items: flex-end; gap: 6px; height: 50px; }
  .bar-wrap { flex: 1; text-align: center; }
  .bar { background: linear-gradient(180deg, #E8A0B4, #C2185B); border-radius: 3px; }
  .bar-date { font-size: 9px; color: #A9788A; margin-top: 3px; }
  .history-row {
    display: flex; justify-content: space-between; align-items: center; padding: 10px 14px;
    background: #fff; border: 1px solid #F3DCE3; border-radius: 10px; margin-bottom: 6px;
  }
  .history-date { font-size: 13px; font-weight: 800; }
  .history-meta { font-size: 12px; color: #A9788A; }
  .delete-btn {
    background: none; border: none; font-size: 16px; cursor: pointer;
    padding: 4px 8px; color: #C48A9B; align-self: center;
  }
  .overlay {
    position: fixed; inset: 0; background: rgba(46,42,37,.4);
    display: flex; align-items: flex-end; justify-content: center; z-index: 50;
  }
  .overlay.hidden { display: none; }
  .modal {
    background: #FDF6F7; border-radius: 20px 20px 0 0; padding: 22px 20px 28px;
    width: 100%; max-width: 480px;
  }
  .modal h3 { font-size: 19px; margin-bottom: 2px; }
  .modal-target { font-size: 12.5px; color: #9C4F63; margin-bottom: 16px; }
  .input-label { font-size: 11.5px; font-weight: 800; color: #9C4F63; text-transform: uppercase; display: block; margin-bottom: 5px; }
  .modal input {
    width: 100%; border: 1px solid #F3DCE3; border-radius: 10px; padding: 10px 12px;
    font-size: 15px; margin-bottom: 12px; outline: none; background: #fff; font-family: inherit;
  }
  .modal-actions { display: flex; gap: 10px; margin-top: 8px; }
  .cancel-btn, .confirm-btn {
    border: none; border-radius: 12px; padding: 13px 0; font-size: 14px; font-weight: 800; cursor: pointer;
  }
  .cancel-btn { flex: 1; background: #FBEEF1; color: #A9788A; }
  .confirm-btn { flex: 2; background: #C2185B; color: #fff; }
  .hidden { display: none !important; }
  .loading-wrap { text-align: center; padding: 60px 20px; color: #A9788A; font-size: 14px; }
  .detail-row { display: flex; justify-content: space-between; padding: 11px 16px; border-bottom: 1px solid #FBEEF1; font-size: 13.5px; }
  .detail-row:last-child { border-bottom: none; }
  .detail-name { font-weight: 700; }
  .detail-val { color: #9C4F63; }
  .detail-val.skipped { color: #C48A9B; font-style: italic; }
  .detail-val.missing { color: #C9B8BE; }
</style>
</head>
<body>

<header>
  <div class="header-row"><span>🎀</span><h1>Full-Body Routine</h1><span>🎀</span></div>
  <p class="subtitle">Stability & joint-health focus</p>
</header>

<nav>
  <button class="tab-btn active" id="tabToday" onclick="switchTab('today')">Today</button>
  <button class="tab-btn" id="tabProgress" onclick="switchTab('progress')">Progress</button>
</nav>

<div id="storageWarning" class="hidden" style="margin:0 20px 12px;padding:10px 14px;background:#FCE4E4;color:#B23A3A;border-radius:10px;font-size:12.5px;">
  Heads up: couldn't reach saved progress this time — your history may not update until this reloads.
</div>

<div class="content" id="todayContent"><div class="loading-wrap">Loading your progress…</div></div>
<div class="content hidden" id="progressContent"></div>

<div class="overlay hidden" id="modalOverlay" onclick="closeModal(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <h3 id="modalTitle"></h3>
    <p class="modal-target" id="modalTarget"></p>
    <label class="input-label">Weight</label>
    <input id="inputWeight" placeholder="e.g. 15lbs">
    <label class="input-label">Reps</label>
    <input id="inputReps" placeholder="8-10">
    <label class="input-label">Sets</label>
    <input id="inputSets" placeholder="3">
    <div class="modal-actions">
      <button class="cancel-btn" onclick="closeModal()">Cancel</button>
      <button class="confirm-btn" onclick="confirmLog()">Log it</button>
    </div>
  </div>
</div>

<div class="overlay hidden" id="detailOverlay" onclick="closeDetail(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <h3 id="detailTitle"></h3>
    <p class="modal-target" id="detailStats"></p>
    <div class="list" id="detailList" style="margin-top:12px;margin-bottom:16px;"></div>
    <button class="cancel-btn" style="width:100%" onclick="closeDetail()">Close</button>
  </div>
</div>

<script>
const WARMUP = ["Hops", "Dead arms", "Zen arms", "Body waves", "Trunk twists", "Rotating arms", "Ballerina squats", "Marches", "90-90s", "Leg raises · 15", "Double leg raises · 5", "Wrist stretch", "Hip hurdles", "Glute bridges · 10 × 3"];

const MAIN = [
  { id: "goblet_squat", name: "Goblet squat", weight: "15-20 lbs", reps: "8-12", sets: 3 },
  { id: "single_leg_rdl", name: "Single-leg RDL", weight: "Bodyweight / light DB", reps: "8-10/side", sets: 3 },
  { id: "floor_press", name: "Floor press", weight: "10 lbs", reps: "8-10", sets: 3 },
  { id: "single_arm_row", name: "Single-arm row", weight: "15-20 lbs", reps: "8-10/side", sets: 3 },
  { id: "lateral_lunge", name: "Lateral lunge", weight: "Bodyweight / light DB", reps: "8-10/side", sets: 3 },
  { id: "farmers_carry", name: "Farmer's carries", weight: "40-45 lbs", reps: "30-35 sec", sets: 3 },
  { id: "dead_hang", name: "Dead hangs", weight: "Bodyweight", reps: "30 sec", sets: 3 },
  { id: "dead_bug", name: "Dead bugs", weight: "Bodyweight", reps: "10/side", sets: 3 },
  { id: "pallof_press", name: "Pallof press", weight: "Light DB / band", reps: "10/side", sets: 3 },
  { id: "rear_delt_fly", name: "Rear delt fly", weight: "5 lbs", reps: "8-12", sets: 3 },
  { id: "plank", name: "Plank", weight: "Bodyweight", reps: "Max time", sets: 3 },
];

const COOLDOWN = ["Standing forward fold · Hold 20-30 sec", "Quad stretch · 20-30 sec/side", "Hip flexor stretch · 20-30 sec/side", "Chest/shoulder stretch · 20-30 sec/side", "Calf stretch · 20-30 sec/side", "Meditation w/ box breathing · 4-4-4-4 · 10 min"];

const HISTORY_KEY = "workout_history";

let log = {};
let phase = "warmup";
let activeExercise = null;
let statsForm = { duration: "", calories: "", bpm: "" };
let history = [];
let storageOk = true;
let saving = false;
let ready = false;
let warmupChecked = new Set();
let cooldownChecked = new Set();
let lastWarmup = { done: 0, total: WARMUP.length };
let lastCooldown = { done: 0, total: COOLDOWN.length };

function todayKey() { return new Date().toISOString().slice(0, 10); }
function fmtDate(key) {
  const d = new Date(key + "T00:00:00");
  return d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
}

async function loadHistory() {
  try {
    const raw = localStorage.getItem(HISTORY_KEY);
    history = raw ? JSON.parse(raw) : [];
    storageOk = true;
  } catch (e) {
    history = [];
    storageOk = false;
  }
}

async function saveHistory() {
  try {
    localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
    storageOk = true;
  } catch (e) {
    storageOk = false;
  }
  document.getElementById("storageWarning").classList.toggle("hidden", storageOk);
}

function toggleCheck(set, index) {
  if (set.has(index)) set.delete(index);
  else set.add(index);
  renderToday();
}

function switchTab(tab) {
  document.getElementById("tabToday").classList.toggle("active", tab === "today");
  document.getElementById("tabProgress").classList.toggle("active", tab === "progress");
  document.getElementById("todayContent").classList.toggle("hidden", tab !== "today");
  document.getElementById("progressContent").classList.toggle("hidden", tab !== "progress");
  if (tab === "progress") renderProgress();
}

function openExercise(id) {
  activeExercise = MAIN.find((e) => e.id === id);
  const existing = log[id];
  document.getElementById("modalTitle").textContent = activeExercise.name;
  document.getElementById("modalTarget").textContent = `Target: ${activeExercise.weight} · ${activeExercise.reps} × ${activeExercise.sets}`;
  document.getElementById("inputWeight").value = existing?.weight || "";
  document.getElementById("inputReps").value = existing?.reps || "";
  document.getElementById("inputSets").value = existing?.sets || "3";
  document.getElementById("modalOverlay").classList.remove("hidden");
}

function closeModal(e) {
  if (e && e.target !== document.getElementById("modalOverlay")) return;
  document.getElementById("modalOverlay").classList.add("hidden");
  activeExercise = null;
}

function confirmLog() {
  log[activeExercise.id] = {
    weight: document.getElementById("inputWeight").value,
    reps: document.getElementById("inputReps").value,
    sets: document.getElementById("inputSets").value,
    status: "done",
  };
  document.getElementById("modalOverlay").classList.add("hidden");
  activeExercise = null;
  renderToday();
}

function skipExercise(id, event) {
  event.stopPropagation();
  log[id] = { status: "skipped" };
  renderToday();
}

function goPhase(p) {
  phase = p;
  renderToday();
}

function updateStat(key, value) {
  statsForm[key] = value;
}

async function finishSession() {
  if (saving) return;
  saving = true;
  phase = "saving";
  renderToday();

  const entry = {
    date: todayKey(),
    exercises: log,
    stats: statsForm,
    warmup: { done: warmupChecked.size, total: WARMUP.length },
    cooldown: { done: cooldownChecked.size, total: COOLDOWN.length },
  };
  history = [...history.filter((h) => h.date !== todayKey()), entry];
  await saveHistory();

  saving = false;
  phase = "done";
  lastWarmup = { done: warmupChecked.size, total: WARMUP.length };
  lastCooldown = { done: cooldownChecked.size, total: COOLDOWN.length };
  warmupChecked = new Set();
  cooldownChecked = new Set();
  renderToday();
}

function renderToday() {
  const el = document.getElementById("todayContent");
  const doneCount = MAIN.filter((ex) => log[ex.id]?.status === "done").length;
  const skippedCount = MAIN.filter((ex) => log[ex.id]?.status === "skipped").length;

  if (phase === "warmup") {
    el.innerHTML = `
      <h2 class="section-title">🌸 Warm-Up</h2>
      <p class="progress-text" style="display:block;margin-bottom:8px;">${warmupChecked.size} of ${WARMUP.length} done</p>
      <div class="simple-list">${WARMUP.map((w, i) => `
        <div class="check-item ${warmupChecked.has(i) ? "checked" : ""}" onclick="toggleCheck(warmupChecked, ${i})">
          <span class="check-circle">${warmupChecked.has(i) ? "✓" : ""}</span>
          <span class="check-label">${w}</span>
        </div>
      `).join("")}</div>
      <button class="primary-btn" onclick="goPhase('main')">Start main routine →</button>
    `;
  } else if (phase === "main") {
    const pct = ((doneCount + skippedCount) / MAIN.length) * 100;
    el.innerHTML = `
      <div style="margin-bottom:16px">
        <span class="progress-text">${doneCount + skippedCount} of ${MAIN.length} logged</span>
        <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
      </div>
      <div class="list">
        ${MAIN.map((ex) => {
          const entry = log[ex.id];
          const meta = entry?.status === "done"
            ? `${entry.weight || "—"} · ${entry.reps || ex.reps} × ${entry.sets || ex.sets}`
            : entry?.status === "skipped" ? "Skipped"
            : `${ex.weight} · ${ex.reps} × ${ex.sets}`;
          return `
            <div class="row" onclick="openExercise('${ex.id}')">
              <div class="row-main">
                <div class="ex-name">${ex.name}</div>
                <div class="ex-meta">${meta}</div>
              </div>
              <div class="row-actions">
                ${entry?.status === "done" ? '<span class="badge done">✓</span>' : ""}
                ${entry?.status === "skipped" ? '<span class="badge skipped">⏭</span>' : ""}
                ${!entry ? `<button class="skip-btn" onclick="skipExercise('${ex.id}', event)">Skip</button>` : ""}
                <span class="chevron">›</span>
              </div>
            </div>
          `;
        }).join("")}
      </div>
      <button class="primary-btn" onclick="goPhase('cooldown')">Finish main routine →</button>
    `;
  } else if (phase === "cooldown") {
    el.innerHTML = `
      <h2 class="section-title">🕊️ Cool-Down</h2>
      <p class="progress-text" style="display:block;margin-bottom:8px;">${cooldownChecked.size} of ${COOLDOWN.length} done</p>
      <div class="simple-list">${COOLDOWN.map((c, i) => `
        <div class="check-item ${cooldownChecked.has(i) ? "checked" : ""}" onclick="toggleCheck(cooldownChecked, ${i})">
          <span class="check-circle">${cooldownChecked.has(i) ? "✓" : ""}</span>
          <span class="check-label">${c}</span>
        </div>
      `).join("")}</div>
      <button class="primary-btn" onclick="goPhase('stats')">Log workout stats →</button>
    `;
  } else if (phase === "stats") {
    el.innerHTML = `
      <h2 class="section-title">How'd it go? ✨</h2>
      <div class="stat-box">
        <div class="stat-label">⏱ Duration (min)</div>
        <input class="stat-input" oninput="updateStat('duration', this.value)" value="${statsForm.duration}" inputmode="numeric" placeholder="—">
      </div>
      <div class="stat-box">
        <div class="stat-label">🔥 Calories</div>
        <input class="stat-input" oninput="updateStat('calories', this.value)" value="${statsForm.calories}" inputmode="numeric" placeholder="—">
      </div>
      <div class="stat-box">
        <div class="stat-label">♥ Avg heart rate (bpm)</div>
        <input class="stat-input" oninput="updateStat('bpm', this.value)" value="${statsForm.bpm}" inputmode="numeric" placeholder="—">
      </div>
      <button class="primary-btn" onclick="finishSession()" style="margin-top:8px">Save workout ✓</button>
    `;
  } else if (phase === "saving") {
    el.innerHTML = `<div class="loading-wrap">Saving your workout…</div>`;
  } else if (phase === "done") {
    el.innerHTML = `
      <div class="done-wrap">
        <div class="done-emoji">🎀</div>
        <h2 class="done-title">Workout logged!</h2>
        <p class="subtitle">${doneCount} exercises completed${skippedCount > 0 ? `, ${skippedCount} skipped` : ""}</p>
        <div class="done-stats">
          ${statsForm.duration ? `<span>⏱ ${statsForm.duration} min</span>` : ""}
          ${statsForm.calories ? `<span>🔥 ${statsForm.calories} cal</span>` : ""}
          ${statsForm.bpm ? `<span>♥ ${statsForm.bpm} bpm</span>` : ""}
        </div>
        <div class="done-stats" style="margin-top:6px;">
          <span>🌸 ${lastWarmup.done}/${lastWarmup.total}</span>
          <span>🕊️ ${lastCooldown.done}/${lastCooldown.total}</span>
        </div>
        <button class="view-progress-btn" onclick="switchTab('progress')">📈 View progress</button>
      </div>
    `;
  }
}

async function deleteSession(date, event) {
  event.stopPropagation();
  const confirmed = confirm(`Delete the ${fmtDate(date)} session? This can't be undone.`);
  if (!confirmed) return;
  history = history.filter((h) => h.date !== date);
  await saveHistory();
  renderProgress();
}

function showDetail(date) {
  const h = history.find((e) => e.date === date);
  if (!h) return;

  document.getElementById("detailTitle").textContent = fmtDate(date);

  const statsParts = [];
  if (h.stats?.duration) statsParts.push(`⏱ ${h.stats.duration} min`);
  if (h.stats?.calories) statsParts.push(`🔥 ${h.stats.calories} cal`);
  if (h.stats?.bpm) statsParts.push(`♥ ${h.stats.bpm} bpm`);
  if (h.warmup) statsParts.push(`🌸 Warm-up ${h.warmup.done}/${h.warmup.total}`);
  if (h.cooldown) statsParts.push(`🕊️ Cool-down ${h.cooldown.done}/${h.cooldown.total}`);
  document.getElementById("detailStats").textContent = statsParts.join(" · ") || "No session stats logged";

  const rows = MAIN.map((ex) => {
    const entry = h.exercises[ex.id];
    let valHtml, cls;
    if (entry?.status === "done") {
      valHtml = `${entry.weight || "—"} · ${entry.reps || ex.reps} × ${entry.sets || ex.sets}`;
      cls = "";
    } else if (entry?.status === "skipped") {
      valHtml = "Skipped";
      cls = "skipped";
    } else {
      valHtml = "Not logged";
      cls = "missing";
    }
    return `
      <div class="detail-row">
        <span class="detail-name">${ex.name}</span>
        <span class="detail-val ${cls}">${valHtml}</span>
      </div>
    `;
  }).join("");

  document.getElementById("detailList").innerHTML = rows;
  document.getElementById("detailOverlay").classList.remove("hidden");
}

function closeDetail(e) {
  if (e && e.target !== document.getElementById("detailOverlay")) return;
  document.getElementById("detailOverlay").classList.add("hidden");
}

function renderProgress() {
  const el = document.getElementById("progressContent");
  if (history.length === 0) {
    el.innerHTML = `
      <div class="empty-state">
        <div style="font-size:32px">🏋️</div>
        <p>No workouts logged yet.<br>Finish today's session to start tracking.</p>
      </div>
    `;
    return;
  }

  let html = `<p class="progress-text">${history.length} session${history.length !== 1 ? "s" : ""} logged</p>`;

  MAIN.forEach((ex) => {
    const data = history
      .filter((h) => h.exercises[ex.id]?.status === "done")
      .map((h) => ({ date: fmtDate(h.date), weight: parseFloat(h.exercises[ex.id].weight) || 0 }))
      .filter((d) => d.weight > 0);
    if (data.length === 0) return;
    const latest = data[data.length - 1].weight;
    const maxW = Math.max(...data.map((d) => d.weight));
    html += `
      <div class="chart-card">
        <div class="chart-header">
          <span class="name">${ex.name}</span>
          <span class="latest">${latest} lbs</span>
        </div>
        <div class="bars">
          ${data.map((d) => `
            <div class="bar-wrap">
              <div class="bar" style="height:${(d.weight / maxW) * 40 + 6}px"></div>
              <div class="bar-date">${d.date}</div>
            </div>
          `).join("")}
        </div>
      </div>
    `;
  });

  html += `<h3 class="done-title2" style="font-size:16px;font-weight:700;color:#C2185B;margin:20px 0 10px">Session history</h3>`;
  [...history].reverse().forEach((h) => {
    const doneN = Object.values(h.exercises).filter((e) => e.status === "done").length;
    html += `
      <div class="history-row" onclick="showDetail('${h.date}')" style="cursor:pointer">
        <div>
          <span class="history-date">${fmtDate(h.date)}</span><br>
          <span class="history-meta">${doneN} done${h.stats?.duration ? ` · ${h.stats.duration} min` : ""}${h.stats?.calories ? ` · ${h.stats.calories} cal` : ""}</span>
        </div>
        <button class="delete-btn" onclick="deleteSession('${h.date}', event)" aria-label="Delete session">🗑</button>
      </div>
    `;
  });

  el.innerHTML = html;
}

(async function init() {
  await loadHistory();

  // If today's session was already saved, pick up where it left off
  const todays = history.find((h) => h.date === todayKey());
  if (todays) {
    log = todays.exercises || {};
    statsForm = todays.stats || { duration: "", calories: "", bpm: "" };
  }

  ready = true;
  renderToday();
})();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
</script>
</body>
</html>
